<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hackathon Pitch Generator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            max-width: 700px; 
            margin: 50px auto; 
            padding: 20px; 
        }
        input { 
            width: 70%; 
            padding: 12px; 
            margin-right: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        button { 
            padding: 12px 20px; 
            background-color: #0078D7; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
        }
        button:hover { 
            background-color: #005A9E; 
        }
        pre { 
            background: #f8f9fa; 
            padding: 20px; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            border-radius: 6px; 
            border: 1px solid #dee2e6; 
            line-height: 1.5; 
            font-family: inherit; 
        }
    </style>
</head>
<body>
    <h2>🚀 AI Hackathon Pitch Generator</h2>
    <p>Enter a hackathon theme below to generate a complete project pitch and team structure.</p>
    
    <div>
        <input type="text" id="themeInput" placeholder="e.g., AI for Social Good">
        <button onclick="generatePitch()">Generate Pitch</button>
    </div>
    
    <h3 style="margin-top: 30px;">Result:</h3>
    <pre id="resultBox">Your generated pitch will appear here...</pre>

    <script>
        async function generatePitch() {
            const theme = document.getElementById("themeInput").value;
            const resultBox = document.getElementById("resultBox");
            
            if (!theme) {
                alert("Please enter a theme!");
                return;
            }

            resultBox.innerText = "Thinking... 🧠";

            try {
                // This fetches the data from your local FastAPI server
                const response = await fetch("http://127.0.0.1:8000/generate-pitch", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ theme: theme })
                });
                
                const data = await response.json();
                if (data.success) {
                    resultBox.innerText = data.pitch_plan;
                } else {
                    resultBox.innerText = "Error generating pitch.";
                }
            } catch (error) {
                resultBox.innerText = "Failed to connect to the API. Is your FastAPI server running?";
            }
        }
    </script>
</body>
</html>
